<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Wordle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 12px 8px;
    }
    header {
      text-align: center;
      width: 100%;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 2px;
    }
    #board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      grid-gap: 6px;
      margin: 12px 0;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-gap: 6px;
    }
    .tile {
      width: 52px;
      height: 52px;
      max-width: 14vw;
      max-height: 14vw;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      transition: all 0.25s ease;
    }
    .tile.filled { border-color: #64748b; }
    .tile.correct { background: #10b981; border-color: #10b981; color: white; }
    .tile.present { background: #eab308; border-color: #eab308; color: white; }
    .tile.absent { background: #334155; border-color: #334155; color: #94a3b8; }

    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 480px;
    }
    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    .key {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 12px 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .key.wide { padding: 12px 14px; font-size: 11px; }
    .key.correct { background: #10b981; border-color: #10b981; }
    .key.present { background: #eab308; border-color: #eab308; }
    .key.absent { background: #1e293b; opacity: 0.35; }
    .key:active { background: #3b82f6; }

    #toast {
      position: fixed;
      top: 60px;
      background: #f43f5e;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }

    #dialog {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      padding: 20px;
      text-align: center;
    }
    #dialog.show { opacity: 1; pointer-events: auto; }
    #dialog h2 { font-size: 24px; margin-bottom: 8px; color: #38bdf8; }
    #dialog p { font-size: 14px; color: #94a3b8; margin-bottom: 16px; }
    #dialog button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>CYBER WORDLE</h1>
  </header>

  <div id="toast">Not enough letters</div>

  <div id="board"></div>

  <div id="keyboard"></div>

  <div id="dialog">
    <h2 id="dlg-title">VICTORY!</h2>
    <p id="dlg-desc">The word was: <b>CYBER</b></p>
    <button id="dlg-btn">PLAY AGAIN</button>
  </div>

  <script>
    const WORDS = [
      'GAMES', 'CYBER', 'ROBOT', 'LASER', 'PIXEL', 'SPACE', 'RADAR', 'DRIVE',
      'BLOCK', 'CHESS', 'AUDIO', 'FLASH', 'SHARK', 'NINJA', 'BLAST', 'POWER',
      'GHOST', 'PULSE', 'QUEST', 'TITAN', 'VAPOR', 'HYPER', 'RETRO', 'TRACK'
    ];

    let targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
    let currentRow = 0;
    let currentTile = 0;
    let guesses = Array.from({ length: 6 }, () => '');
    let isGameOver = false;

    const board = document.getElementById('board');
    const kb = document.getElementById('keyboard');
    const toast = document.getElementById('toast');
    const dialog = document.getElementById('dialog');
    const dlgTitle = document.getElementById('dlg-title');
    const dlgDesc = document.getElementById('dlg-desc');
    const dlgBtn = document.getElementById('dlg-btn');

    function initBoard() {
      board.innerHTML = '';
      for (let r = 0; r < 6; r++) {
        const row = document.createElement('div');
        row.className = 'row';
        for (let c = 0; c < 5; c++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.id = `t-${r}-${c}`;
          row.appendChild(tile);
        }
        board.appendChild(row);
      }
    }

    const KEYS = [
      ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
      ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
      ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'DEL']
    ];

    function initKeyboard() {
      kb.innerHTML = '';
      KEYS.forEach(rowKeys => {
        const row = document.createElement('div');
        row.className = 'kb-row';
        rowKeys.forEach(k => {
          const btn = document.createElement('button');
          btn.className = 'key' + (k.length > 1 ? ' wide' : '');
          btn.innerText = k;
          btn.id = 'k-' + k;
          btn.onclick = () => handleInput(k);
          row.appendChild(btn);
        });
        kb.appendChild(row);
      });
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function handleInput(k) {
      if (isGameOver) return;

      if (k === 'DEL' || k === 'BACKSPACE') {
        if (currentTile > 0) {
          currentTile--;
          guesses[currentRow] = guesses[currentRow].slice(0, -1);
          const t = document.getElementById(`t-${currentRow}-${currentTile}`);
          t.innerText = '';
          t.classList.remove('filled');
        }
      } else if (k === 'ENTER') {
        if (currentTile < 5) {
          showToast('Not enough letters');
          return;
        }
        submitGuess();
      } else if (/^[A-Z]$/i.test(k) && currentTile < 5) {
        const letter = k.toUpperCase();
        guesses[currentRow] += letter;
        const t = document.getElementById(`t-${currentRow}-${currentTile}`);
        t.innerText = letter;
        t.classList.add('filled');
        currentTile++;
      }
    }

    function submitGuess() {
      const guess = guesses[currentRow];
      const targetLetters = targetWord.split('');

      // Check results
      for (let i = 0; i < 5; i++) {
        const t = document.getElementById(`t-${currentRow}-${i}`);
        const letter = guess[i];
        const keyBtn = document.getElementById('k-' + letter);

        if (letter === targetLetters[i]) {
          t.classList.add('correct');
          if (keyBtn) { keyBtn.className = 'key correct'; }
          targetLetters[i] = null;
        } else if (targetLetters.includes(letter)) {
          t.classList.add('present');
          if (keyBtn && !keyBtn.classList.contains('correct')) {
            keyBtn.className = 'key present';
          }
        } else {
          t.classList.add('absent');
          if (keyBtn && !keyBtn.classList.contains('correct') && !keyBtn.classList.contains('present')) {
            keyBtn.className = 'key absent';
          }
        }
      }

      if (guess === targetWord) {
        isGameOver = true;
        setTimeout(() => {
          dlgTitle.innerText = 'SPLENDID!';
          dlgDesc.innerHTML = `You cracked the code in <b>${currentRow + 1}</b> attempts!`;
          dialog.classList.add('show');
        }, 500);
        return;
      }

      currentRow++;
      currentTile = 0;

      if (currentRow >= 6) {
        isGameOver = true;
        setTimeout(() => {
          dlgTitle.innerText = 'MISSION FAILED';
          dlgDesc.innerHTML = `The secret word was: <b>${targetWord}</b>`;
          dialog.classList.add('show');
        }, 500);
      }
    }

    function reset() {
      targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
      currentRow = 0;
      currentTile = 0;
      guesses = Array.from({ length: 6 }, () => '');
      isGameOver = false;
      dialog.classList.remove('show');
      initBoard();
      initKeyboard();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace') handleInput('DEL');
      else if (e.key === 'Enter') handleInput('ENTER');
      else if (/^[a-zA-Z]$/.test(e.key)) handleInput(e.key.toUpperCase());
    });

    dlgBtn.onclick = reset;

    initBoard();
    initKeyboard();
  </script>
</body>
</html>
