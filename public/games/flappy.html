<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pixel Flap Bird</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #060913;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 360px;
      height: 520px;
      max-width: 95vw;
      max-height: 85vh;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #0f172a;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 9, 19, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #overlay.hidden { display: none; }
    h1 { font-size: 26px; color: #38bdf8; margin-bottom: 8px; font-weight: 800; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 16px; text-align: center; }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    #score-hud {
      position: absolute;
      top: 16px;
      left: 0; right: 0;
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="score-hud">0</div>
    <canvas id="canvas" width="360" height="520"></canvas>
    <div id="overlay">
      <h1 id="overlay-title">PIXEL FLAP</h1>
      <p id="overlay-desc">Press Space, Click, or Tap to flap wings and avoid pipes.</p>
      <button id="start-btn">FLAP WINGS</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreHud = document.getElementById('score-hud');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const startBtn = document.getElementById('start-btn');

    let birdY = 220;
    let birdVelocity = 0;
    const gravity = 0.38;
    const jump = -6.5;
    const birdSize = 16;

    let pipes = [];
    let pipeSpeed = 2.4;
    let pipeSpawnTimer = 0;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    let isRunning = false;

    // Web Audio FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, dur = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function flap() {
      if (!isRunning) return;
      birdVelocity = jump;
      playTone(480, 0.05);
    }

    function startGame() {
      birdY = 200;
      birdVelocity = 0;
      pipes = [];
      score = 0;
      pipeSpawnTimer = 0;
      scoreHud.innerText = '0';
      overlay.classList.add('hidden');
      isRunning = true;
      playTone(550, 0.1);
      requestAnimationFrame(loop);
    }

    function gameOver() {
      isRunning = false;
      playTone(180, 0.25);
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('flappy_best', bestScore);
      }
      overlayTitle.innerText = 'GAME OVER';
      startBtn.innerText = 'PLAY AGAIN';
      document.getElementById('overlay-desc').innerText = `Score: ${score} · Best: ${bestScore}`;
      overlay.classList.remove('hidden');
    }

    function spawnPipe() {
      const gap = 125;
      const minH = 50;
      const maxH = canvas.height - gap - minH;
      const topHeight = Math.floor(Math.random() * (maxH - minH)) + minH;
      pipes.push({
        x: canvas.width,
        topHeight: topHeight,
        bottomY: topHeight + gap,
        width: 48,
        scored: false
      });
    }

    function loop() {
      if (!isRunning) return;

      birdVelocity += gravity;
      birdY += birdVelocity;

      // Ground or ceiling
      if (birdY + birdSize >= canvas.height || birdY - birdSize <= 0) {
        gameOver();
        return;
      }

      // Pipes
      pipeSpawnTimer++;
      if (pipeSpawnTimer > 90) {
        spawnPipe();
        pipeSpawnTimer = 0;
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= pipeSpeed;

        // Collision box
        const birdLeft = 70 - birdSize;
        const birdRight = 70 + birdSize;
        const birdTop = birdY - birdSize;
        const birdBottom = birdY + birdSize;

        if (birdRight > p.x && birdLeft < p.x + p.width) {
          if (birdTop < p.topHeight || birdBottom > p.bottomY) {
            gameOver();
            return;
          }
        }

        // Score
        if (!p.scored && p.x + p.width < 70) {
          p.scored = true;
          score++;
          scoreHud.innerText = score;
          playTone(660, 0.08);
        }

        if (p.x + p.width < 0) {
          pipes.splice(i, 1);
        }
      }

      render();
      requestAnimationFrame(loop);
    }

    function render() {
      // Sky
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#334155';
      ctx.fillRect(40, 60, 2, 2);
      ctx.fillRect(140, 120, 2, 2);
      ctx.fillRect(250, 45, 2, 2);
      ctx.fillRect(310, 180, 2, 2);

      // Pipes
      pipes.forEach(p => {
        // Top pipe
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x, 0, p.width, p.topHeight);
        ctx.fillStyle = '#059669';
        ctx.fillRect(p.x - 3, p.topHeight - 16, p.width + 6, 16);

        // Bottom pipe
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x, p.bottomY, p.width, canvas.height - p.bottomY);
        ctx.fillStyle = '#059669';
        ctx.fillRect(p.x - 3, p.bottomY, p.width + 6, 16);
      });

      // Ground
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, canvas.height - 15, canvas.width, 15);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.strokeRect(0, canvas.height - 15, canvas.width, 1);

      // Bird
      ctx.save();
      ctx.translate(70, birdY);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, birdVelocity * 0.08));
      ctx.rotate(angle);

      // Bird body
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(0, 0, birdSize, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 8, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(6, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(7, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(12, -2);
      ctx.lineTo(20, 2);
      ctx.lineTo(12, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
        e.preventDefault();
        if (isRunning) flap();
        else startGame();
      }
    });

    canvas.addEventListener('click', () => {
      if (isRunning) flap();
      else startGame();
    });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
