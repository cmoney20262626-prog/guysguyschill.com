<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .window {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 95vw;
    }
    .top-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 14px;
      margin-bottom: 12px;
    }
    .counter {
      font-family: monospace;
      font-size: 22px;
      font-weight: 800;
      color: #ef4444;
      background: #000;
      padding: 4px 8px;
      border-radius: 4px;
      min-width: 54px;
      text-align: center;
    }
    .face-btn {
      font-size: 22px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      cursor: pointer;
      padding: 2px 8px;
    }
    .face-btn:hover { background: #475569; }
    .grid {
      display: grid;
      grid-template-columns: repeat(9, 34px);
      grid-gap: 3px;
      background: #0f172a;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .cell {
      width: 34px;
      height: 34px;
      background: #334155;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.1s;
    }
    .cell:hover { background: #475569; }
    .cell.revealed {
      background: #1e293b;
      border: 1px solid #0f172a;
      cursor: default;
    }
    .cell.mine { background: #dc2626 !important; }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #4ade80; }
    .c-3 { color: #f87171; }
    .c-4 { color: #818cf8; }
    .c-5 { color: #fb923c; }
    .c-6 { color: #2dd4bf; }
    .instructions {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 12px;
      text-align: center;
    }
    .diff-select {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      justify-content: center;
    }
    .diff-btn {
      background: #334155;
      color: #94a3b8;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .diff-btn.active {
      background: #3b82f6;
      color: white;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="diff-select">
      <button class="diff-btn active" id="btn-easy">Easy (9x9)</button>
      <button class="diff-btn" id="btn-med">Medium (12x12)</button>
    </div>

    <div class="top-panel">
      <div class="counter" id="mine-count">010</div>
      <button class="face-btn" id="face-btn">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="instructions">Left-click to reveal · Right-click or Long-press to flag</div>
  </div>

  <script>
    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mine-count');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('face-btn');

    let rows = 9;
    let cols = 9;
    let totalMines = 10;
    let board = [];
    let revealedCount = 0;
    let flagsLeft = 10;
    let gameOver = false;
    let timer = 0;
    let timerInterval = null;
    let firstClick = true;

    function init(r = 9, c = 9, m = 10) {
      rows = r;
      cols = c;
      totalMines = m;
      flagsLeft = m;
      revealedCount = 0;
      gameOver = false;
      firstClick = true;
      clearInterval(timerInterval);
      timer = 0;
      timerEl.innerText = '000';
      mineCountEl.innerText = String(flagsLeft).padStart(3, '0');
      faceBtn.innerText = '🙂';

      gridEl.style.gridTemplateColumns = `repeat(${cols}, 34px)`;
      gridEl.innerHTML = '';

      board = [];
      for (let y = 0; y < rows; y++) {
        let row = [];
        for (let x = 0; x < cols; x++) {
          row.push({
            x, y,
            isMine: false,
            revealed: false,
            flagged: false,
            adjacent: 0
          });

          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.x = x;
          cell.dataset.y = y;

          cell.addEventListener('click', (e) => handleClick(x, y));
          cell.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleFlag(x, y);
          });

          // Mobile long-press for flagging
          let pressTimer;
          cell.addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(() => {
              handleFlag(x, y);
            }, 400);
          }, { passive: true });
          cell.addEventListener('touchend', () => clearTimeout(pressTimer));

          gridEl.appendChild(cell);
        }
        board.push(row);
      }
    }

    function plantMines(safeX, safeY) {
      let planted = 0;
      while (planted < totalMines) {
        let rx = Math.floor(Math.random() * cols);
        let ry = Math.floor(Math.random() * rows);
        if ((rx === safeX && ry === safeY) || board[ry][rx].isMine) continue;
        board[ry][rx].isMine = true;
        planted++;
      }

      // Count adjacents
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (board[y][x].isMine) continue;
          let count = 0;
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              let nx = x + dx;
              let ny = y + dy;
              if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && board[ny][nx].isMine) {
                count++;
              }
            }
          }
          board[y][x].adjacent = count;
        }
      }
    }

    function handleClick(x, y) {
      if (gameOver) return;
      const cellData = board[y][x];
      if (cellData.flagged || cellData.revealed) return;

      if (firstClick) {
        firstClick = false;
        plantMines(x, y);
        timerInterval = setInterval(() => {
          timer++;
          timerEl.innerText = String(Math.min(999, timer)).padStart(3, '0');
        }, 1000);
      }

      if (cellData.isMine) {
        revealAllMines();
        faceBtn.innerText = '😵';
        gameOver = true;
        clearInterval(timerInterval);
        return;
      }

      revealCell(x, y);

      if (revealedCount === rows * cols - totalMines) {
        faceBtn.innerText = '😎';
        gameOver = true;
        clearInterval(timerInterval);
      }
    }

    function revealCell(x, y) {
      const data = board[y][x];
      if (data.revealed || data.flagged) return;

      data.revealed = true;
      revealedCount++;
      const el = getCellEl(x, y);
      el.classList.add('revealed');

      if (data.adjacent > 0) {
        el.innerText = data.adjacent;
        el.classList.add('c-' + data.adjacent);
      } else {
        // Flood fill empty neighbors
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            let nx = x + dx;
            let ny = y + dy;
            if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
              revealCell(nx, ny);
            }
          }
        }
      }
    }

    function handleFlag(x, y) {
      if (gameOver || board[y][x].revealed) return;
      const data = board[y][x];
      const el = getCellEl(x, y);
      data.flagged = !data.flagged;
      if (data.flagged) {
        el.innerText = '🚩';
        flagsLeft--;
      } else {
        el.innerText = '';
        flagsLeft++;
      }
      mineCountEl.innerText = String(flagsLeft).padStart(3, '0');
    }

    function revealAllMines() {
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (board[y][x].isMine) {
            const el = getCellEl(x, y);
            el.innerText = '💣';
            el.classList.add('mine');
          }
        }
      }
    }

    function getCellEl(x, y) {
      return gridEl.children[y * cols + x];
    }

    faceBtn.onclick = () => init(rows, cols, totalMines);

    document.getElementById('btn-easy').onclick = (e) => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      init(9, 9, 10);
    };

    document.getElementById('btn-med').onclick = (e) => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      init(12, 12, 22);
    };

    init(9, 9, 10);
  </script>
</body>
</html>
