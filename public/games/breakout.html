<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Quantum Breakout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #080d1a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
    }
    .hud-chip {
      background: #1e293b;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    #canvas-container {
      position: relative;
      width: 480px;
      height: 480px;
      max-width: 95vw;
      max-height: 80vh;
    }
    canvas {
      width: 100%;
      height: 100%;
      background: #0f172a;
      border: 2px solid #10b981;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
      display: block;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 13, 26, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }
    #overlay.hidden { display: none; }
    h1 { font-size: 26px; margin-bottom: 8px; color: #34d399; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 16px; text-align: center; }
    button {
      background: #059669;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #047857; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="hud-chip">SCORE: <span id="score">0</span></div>
    <div class="hud-chip">LIVES: <span id="lives">3</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="480" height="480"></canvas>
    <div id="overlay">
      <h1 id="overlay-title">QUANTUM BREAKOUT</h1>
      <p>Move mouse / touch / Arrow Keys to aim the paddle.</p>
      <button id="start-btn">LAUNCH BALL</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const startBtn = document.getElementById('start-btn');

    let paddleW = 85;
    let paddleH = 12;
    let paddleX = (canvas.width - paddleW) / 2;
    let rightPressed = false;
    let leftPressed = false;

    let ballRadius = 7;
    let x = canvas.width / 2;
    let y = canvas.height - 35;
    let dx = 4;
    let dy = -4;

    let brickRowCount = 5;
    let brickColumnCount = 7;
    let brickWidth = 56;
    let brickHeight = 18;
    let brickPadding = 9;
    let brickOffsetTop = 45;
    let brickOffsetLeft = 18;

    const rowColors = ['#ef4444', '#f97316', '#eab308', '#10b981', '#06b6d4'];

    let bricks = [];
    let score = 0;
    let lives = 3;
    let isRunning = false;

    // Web Audio FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, dur = 0.05) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, color: rowColors[r] };
        }
      }
    }

    function startGame() {
      initBricks();
      score = 0;
      lives = 3;
      scoreEl.innerText = score;
      livesEl.innerText = lives;
      resetBall();
      isRunning = true;
      overlay.classList.add('hidden');
      draw();
    }

    function resetBall() {
      x = canvas.width / 2;
      y = canvas.height - 35;
      dx = (Math.random() > 0.5 ? 4 : -4);
      dy = -4;
      paddleX = (canvas.width - paddleW) / 2;
    }

    function collisionDetection() {
      let activeBricks = 0;
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          let b = bricks[c][r];
          if (b.status === 1) {
            activeBricks++;
            if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
              dy = -dy;
              b.status = 0;
              score += (brickRowCount - r) * 10;
              scoreEl.innerText = score;
              playBeep(400 + (brickRowCount - r) * 80);
            }
          }
        }
      }
      if (activeBricks === 0) {
        isRunning = false;
        overlayTitle.innerText = 'SECTOR CLEARED! VICTORY!';
        startBtn.innerText = 'PLAY AGAIN';
        overlay.classList.remove('hidden');
        playBeep(880, 0.3);
      }
    }

    function draw() {
      if (!isRunning) return;

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bricks
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status === 1) {
            let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
            let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.fillStyle = bricks[c][r].color;
            ctx.shadowColor = bricks[c][r].color;
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 4);
            ctx.fill();
          }
        }
      }
      ctx.shadowBlur = 0;

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Paddle
      ctx.fillStyle = '#10b981';
      ctx.shadowColor = '#10b981';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.roundRect(paddleX, canvas.height - paddleH - 10, paddleW, paddleH, 6);
      ctx.fill();
      ctx.shadowBlur = 0;

      collisionDetection();

      // Wall bounce
      if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
        dx = -dx;
        playBeep(300);
      }
      if (y + dy < ballRadius) {
        dy = -dy;
        playBeep(300);
      } else if (y + dy > canvas.height - paddleH - 10 - ballRadius) {
        if (x > paddleX && x < paddleX + paddleW) {
          // calculate paddle hit angle
          let hitPoint = (x - (paddleX + paddleW / 2)) / (paddleW / 2);
          dx = hitPoint * 5;
          dy = -Math.abs(dy);
          playBeep(520);
        } else if (y + dy > canvas.height - ballRadius) {
          lives--;
          livesEl.innerText = lives;
          playBeep(180, 0.2);
          if (lives <= 0) {
            isRunning = false;
            overlayTitle.innerText = 'GAME OVER';
            startBtn.innerText = 'TRY AGAIN';
            overlay.classList.remove('hidden');
            return;
          } else {
            resetBall();
          }
        }
      }

      // Keyboard movement
      if (rightPressed && paddleX < canvas.width - paddleW) {
        paddleX += 7;
      } else if (leftPressed && paddleX > 0) {
        paddleX -= 7;
      }

      x += dx;
      y += dy;

      requestAnimationFrame(draw);
    }

    // Input listeners
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd') rightPressed = true;
      if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a') leftPressed = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd') rightPressed = false;
      if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a') leftPressed = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      let rect = canvas.getBoundingClientRect();
      let scaleX = canvas.width / rect.width;
      let relativeX = (e.clientX - rect.left) * scaleX;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddleX = Math.max(0, Math.min(canvas.width - paddleW, relativeX - paddleW / 2));
      }
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      let rect = canvas.getBoundingClientRect();
      let scaleX = canvas.width / rect.width;
      let relativeX = (e.touches[0].clientX - rect.left) * scaleX;
      paddleX = Math.max(0, Math.min(canvas.width - paddleW, relativeX - paddleW / 2));
    }, { passive: false });

    startBtn.addEventListener('click', startGame);
    initBricks();
  </script>
</body>
</html>
