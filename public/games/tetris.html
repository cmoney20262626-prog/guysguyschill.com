<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Block Drop Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #060913;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 8px;
    }
    #game-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      max-width: 95vw;
    }
    #canvas-container {
      position: relative;
      width: 240px;
      height: 480px;
      max-height: 80vh;
      border: 2px solid #8b5cf6;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.2);
    }
    canvas {
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: block;
    }
    #sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 110px;
    }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .panel-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .panel-val {
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
    }
    #nextCanvas {
      background: #0f172a;
      border-radius: 6px;
      margin-top: 4px;
    }
    button {
      background: #7c3aed;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #6d28d9; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 9, 19, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }
    #overlay.hidden { display: none; }
    h2 { font-size: 20px; color: #a78bfa; margin-bottom: 8px; }
    #dpad {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .dp-btn {
      padding: 8px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 14px;
      cursor: pointer;
    }
    .dp-btn:active { background: #7c3aed; }
  </style>
</head>
<body>
  <div id="game-layout">
    <div id="canvas-container">
      <canvas id="tetris" width="240" height="480"></canvas>
      <div id="overlay">
        <h2 id="overlay-title">BLOCK DROP</h2>
        <p style="font-size: 11px; color: #94a3b8; margin-bottom: 12px;">Arrow keys / WASD to move & rotate. Space to hard drop.</p>
        <button id="start-btn">START GAME</button>
      </div>
    </div>

    <div id="sidebar">
      <div class="panel">
        <div class="panel-label">Score</div>
        <div class="panel-val" id="score">0</div>
      </div>
      <div class="panel">
        <div class="panel-label">Lines</div>
        <div class="panel-val" id="lines">0</div>
      </div>
      <div class="panel">
        <div class="panel-label">Next</div>
        <canvas id="nextCanvas" width="80" height="80"></canvas>
      </div>
      <button id="restart-btn" style="background: #334155;">Restart</button>
    </div>
  </div>

  <div id="dpad">
    <button class="dp-btn" id="m-left">◀</button>
    <button class="dp-btn" id="m-rotate">↻</button>
    <button class="dp-btn" id="m-right">▶</button>
    <button class="dp-btn" id="m-down">▼</button>
    <button class="dp-btn" id="m-drop" style="background: #7c3aed;">⤓</button>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK_SIZE = 24;

    const SHAPES = [
      { color: '#06b6d4', matrix: [[1, 1, 1, 1]] }, // I
      { color: '#eab308', matrix: [[1, 1], [1, 1]] }, // O
      { color: '#a855f7', matrix: [[0, 1, 0], [1, 1, 1]] }, // T
      { color: '#10b981', matrix: [[0, 1, 1], [1, 1, 0]] }, // S
      { color: '#ef4444', matrix: [[1, 1, 0], [0, 1, 1]] }, // Z
      { color: '#3b82f6', matrix: [[1, 0, 0], [1, 1, 1]] }, // J
      { color: '#f97316', matrix: [[0, 0, 1], [1, 1, 1]] }  // L
    ];

    let grid = createGrid();
    let piece = null;
    let nextPiece = null;
    let score = 0;
    let lines = 0;
    let dropCounter = 0;
    let dropInterval = 800;
    let lastTime = 0;
    let isRunning = false;

    // Web Audio FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, dur = 0.05) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function createGrid() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    function randomPiece() {
      const type = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      return {
        matrix: type.matrix.map(row => [...row]),
        color: type.color,
        x: Math.floor(COLS / 2) - Math.ceil(type.matrix[0].length / 2),
        y: 0
      };
    }

    function collide(g, p) {
      for (let y = 0; y < p.matrix.length; y++) {
        for (let x = 0; x < p.matrix[y].length; x++) {
          if (p.matrix[y][x] !== 0 &&
              (g[y + p.y] && g[y + p.y][x + p.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(g, p) {
      p.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            g[y + p.y][x + p.x] = p.color;
          }
        });
      });
    }

    function rotate(matrix) {
      return matrix[0].map((_, index) => matrix.map(row => row[index]).reverse());
    }

    function playerRotate() {
      const original = piece.matrix;
      piece.matrix = rotate(piece.matrix);
      if (collide(grid, piece)) {
        piece.matrix = original;
      } else {
        playBeep(450, 0.04);
      }
    }

    function playerMove(dir) {
      piece.x += dir;
      if (collide(grid, piece)) {
        piece.x -= dir;
      } else {
        playBeep(350, 0.03);
      }
    }

    function playerDrop() {
      piece.y++;
      if (collide(grid, piece)) {
        piece.y--;
        merge(grid, piece);
        playBeep(250, 0.04);
        clearLines();
        pieceReset();
      }
      dropCounter = 0;
    }

    function hardDrop() {
      while (!collide(grid, piece)) {
        piece.y++;
      }
      piece.y--;
      merge(grid, piece);
      playBeep(500, 0.06);
      clearLines();
      pieceReset();
      dropCounter = 0;
    }

    function pieceReset() {
      piece = nextPiece || randomPiece();
      nextPiece = randomPiece();
      drawNext();
      if (collide(grid, piece)) {
        // Game Over
        isRunning = false;
        overlayTitle.innerText = 'GAME OVER';
        startBtn.innerText = 'TRY AGAIN';
        overlay.classList.remove('hidden');
        playBeep(160, 0.3);
      }
    }

    function clearLines() {
      let cleared = 0;
      outer: for (let y = ROWS - 1; y >= 0; y--) {
        for (let x = 0; x < COLS; x++) {
          if (grid[y][x] === 0) continue outer;
        }
        const row = grid.splice(y, 1)[0].fill(0);
        grid.unshift(row);
        cleared++;
        y++;
      }

      if (cleared > 0) {
        lines += cleared;
        score += [0, 100, 300, 500, 800][cleared];
        scoreEl.innerText = score;
        linesEl.innerText = lines;
        dropInterval = Math.max(150, 800 - lines * 15);
        playBeep(700 + cleared * 100, 0.15);
      }
    }

    function drawNext() {
      nextCtx.fillStyle = '#0f172a';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      const m = nextPiece.matrix;
      const size = 16;
      const ox = (nextCanvas.width - m[0].length * size) / 2;
      const oy = (nextCanvas.height - m.length * size) / 2;

      m.forEach((row, y) => {
        row.forEach((val, x) => {
          if (val !== 0) {
            nextCtx.fillStyle = nextPiece.color;
            nextCtx.fillRect(ox + x * size, oy + y * size, size - 1, size - 1);
          }
        });
      });
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid guidelines
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * BLOCK_SIZE, 0);
        ctx.lineTo(x * BLOCK_SIZE, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * BLOCK_SIZE);
        ctx.lineTo(canvas.width, y * BLOCK_SIZE);
        ctx.stroke();
      }

      // Placed blocks
      grid.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = value;
            ctx.fillRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
          }
        });
      });

      // Active piece
      if (piece) {
        ctx.fillStyle = piece.color;
        piece.matrix.forEach((row, y) => {
          row.forEach((val, x) => {
            if (val !== 0) {
              ctx.fillRect((piece.x + x) * BLOCK_SIZE + 1, (piece.y + y) * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
            }
          });
        });
      }
    }

    function update(time = 0) {
      if (!isRunning) return;
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    function startGame() {
      grid = createGrid();
      score = 0;
      lines = 0;
      dropInterval = 800;
      scoreEl.innerText = '0';
      linesEl.innerText = '0';
      nextPiece = randomPiece();
      pieceReset();
      overlay.classList.add('hidden');
      isRunning = true;
      lastTime = performance.now();
      requestAnimationFrame(update);
    }

    window.addEventListener('keydown', (e) => {
      if (!isRunning) return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') playerMove(-1);
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') playerMove(1);
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') playerDrop();
      else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') playerRotate();
      else if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); hardDrop(); }
    });

    document.getElementById('m-left').onclick = () => { if (isRunning) playerMove(-1); };
    document.getElementById('m-right').onclick = () => { if (isRunning) playerMove(1); };
    document.getElementById('m-rotate').onclick = () => { if (isRunning) playerRotate(); };
    document.getElementById('m-down').onclick = () => { if (isRunning) playerDrop(); };
    document.getElementById('m-drop').onclick = () => { if (isRunning) hardDrop(); };

    startBtn.onclick = startGame;
    restartBtn.onclick = startGame;

    draw();
  </script>
</body>
</html>
